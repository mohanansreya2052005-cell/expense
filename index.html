

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center text-primary mb-4">Expense Tracker</h1>

    <!-- Expense Form -->
    <div class="card p-4 shadow mb-4">

        <h4>Add Expense</h4>

        <input type="hidden" id="editIndex">

        <input type="text" id="expenseName" class="form-control mb-3" placeholder="Expense Name">

        <input type="number" id="amount" class="form-control mb-3" placeholder="Amount" min="0.01" step="0.01">

        <select id="category" class="form-select mb-3">
            <option value="">Select Category</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Others</option>
        </select>

        <input type="date" id="date" class="form-control mb-3">

        <button onclick="addExpense()" id="submitBtn" class="btn btn-primary">
            Add Expense
        </button>

    </div>

    <!-- Total Expense -->
    <div class="alert alert-success">
        <h4>Total Expense: ₹<span id="totalAmount">0.00</span></h4>
    </div>

    <!-- Category Filter -->
    <div class="mb-3">
        <label class="form-label">Filter by Category</label>

        <select id="filterCategory" class="form-select" onchange="displayExpenses()">
            <option value="All">All Categories</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Others</option>
        </select>
    </div>

    <!-- Expense Table -->
    <div class="table-responsive">
        <table class="table table-bordered table-striped text-center">

            <thead class="table-dark">
                <tr>
                    <th>Expense Name</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="expenseTable"></tbody>

        </table>
    </div>

</div>

<script>

// Get saved expenses from LocalStorage
let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

// Add Expense
function addExpense() {

    let name = document.getElementById("expenseName").value.trim();
    let amount = Number(document.getElementById("amount").value);
    let category = document.getElementById("category").value;
    let date = document.getElementById("date").value;
    let editIndex = document.getElementById("editIndex").value;

    if (name === "" || amount <= 0 || !category || date === "") {
        alert("Please fill all the fields correctly");
        return;
    }

    let expense = {
        name: name,
        amount: amount,
        category: category,
        date: date
    };

    if (editIndex === "") {
        expenses.push(expense);
    } else {
        expenses[Number(editIndex)] = expense;
    }

    localStorage.setItem("expenses", JSON.stringify(expenses));

    document.getElementById("expenseName").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("category").value = "";
    document.getElementById("date").value = "";
    document.getElementById("editIndex").value = "";

    document.getElementById("submitBtn").textContent = "Add Expense";

    displayExpenses();
}

// Display Expenses
function displayExpenses() {

    let table = document.getElementById("expenseTable");
    let filter = document.getElementById("filterCategory").value;

    table.innerHTML = "";

    expenses.forEach(function(expense, index) {

        if (filter !== "All" && filter !== expense.category) {
            return;
        }

        let row = document.createElement("tr");

        let nameCell = document.createElement("td");
        nameCell.textContent = expense.name;

        let amountCell = document.createElement("td");
        amountCell.textContent = "₹" + Number(expense.amount).toFixed(2);

        let categoryCell = document.createElement("td");
        categoryCell.textContent = expense.category;

        let dateCell = document.createElement("td");
        dateCell.textContent = expense.date;

        let actionCell = document.createElement("td");

        let editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.className = "btn btn-warning btn-sm me-2";
        editButton.onclick = function() {
            editExpense(index);
        };

        let deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "btn btn-danger btn-sm";
        deleteButton.onclick = function() {
            deleteExpense(index);
        };

        actionCell.appendChild(editButton);
        actionCell.appendChild(deleteButton);

        row.appendChild(nameCell);
        row.appendChild(amountCell);
        row.appendChild(categoryCell);
        row.appendChild(dateCell);
        row.appendChild(actionCell);

        table.appendChild(row);
    });

    calculateTotal();
}

// Calculate Total
function calculateTotal() {

    let total = 0;

    expenses.forEach(function(expense) {
        total += Number(expense.amount);
    });

    document.getElementById("totalAmount").textContent = total.toFixed(2);
}

// Edit Expense
function editExpense(index) {

    let expense = expenses[index];

    document.getElementById("expenseName").value = expense.name;
    document.getElementById("amount").value = expense.amount;
    document.getElementById("category").value = expense.category;
    document.getElementById("date").value = expense.date;

    document.getElementById("editIndex").value = index;

    document.getElementById("submitBtn").textContent = "Update Expense";

    window.scrollTo(0, 0);
}

// Delete Expense
function deleteExpense(index) {

    if (confirm("Are you sure you want to delete this expense?")) {

        expenses.splice(index, 1);

        localStorage.setItem("expenses", JSON.stringify(expenses));

        displayExpenses();
    }
}

// Display saved expenses when page loads
displayExpenses();

</script>

</body>
</html>
